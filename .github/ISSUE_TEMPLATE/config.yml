blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/tokenzyme/tokenzyme-mobile/security/advisories/new
    about: Never report vulnerabilities in a public issue. Use private disclosure — see SECURITY.md.
  - name: Report a chart problem
    url: https://github.com/tokenzyme/tokenzyme-app/issues
    about: The chart is a WebView of the web client. Chart bugs belong in tokenzyme-app.
  - name: Report a smart contract issue
    url: https://github.com/tokenzyme/tokenzyme-contracts/issues
    about: Issues with the on-chain protocol belong in the contracts repository.
  - name: Ask a question
    url: https://github.com/tokenzyme/tokenzyme-mobile/discussions
    about: Questions and design discussions belong in Discussions, not issues.
