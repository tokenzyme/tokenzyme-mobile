name: tokenzyme_mobile
description: 'Mobile client for Tokenzyme, a permissionless token launchpad for EVM chains.'
version: 1.0.1+2

repository: https://github.com/tokenzyme/tokenzyme-mobile
issue_tracker: https://github.com/tokenzyme/tokenzyme-mobile/issues

publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  awesome_extensions: 2.1.1
  decimal: 3.2.6
  flutter_dotenv: 5.2.1
  flutter_hooks: 0.21.3+1
  flutter_native_splash: 2.4.8
  flutter_secure_storage: 9.2.4
  gql: 1.0.1
  graphql_flutter: 5.3.0
  hooks_riverpod: 3.3.2
  http: 1.6.0
  hugeicons: 0.0.11
  image_picker: 1.2.3
  intl: 0.20.3
  json_annotation: 4.12.0
  package_info_plus: 8.3.1
  reown_appkit: 1.8.3
  riverpod_annotation: 4.0.3
  shared_preferences: 2.5.5
  sliver_tools: 0.2.12
  socket_io_client: 3.1.6
  timeago: 3.7.1
  top_snackbar_flutter: 3.3.0
  url_launcher: 6.3.2
  web3dart: 3.0.3
  webview_flutter: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  flutter_lints: 6.0.0
  graphql_codegen: 3.0.2
  json_serializable: 6.14.1
  riverpod_generator: 4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/erc20_abi.json
    - assets/launchpad_abi.json
    - assets/splash.png
    - .env
  fonts:
    - family: Ubuntu
      fonts:
        - asset: fonts/Ubuntu/Ubuntu-Light.ttf
          weight: 300
        - asset: fonts/Ubuntu/Ubuntu-Regular.ttf
          weight: 400
        - asset: fonts/Ubuntu/Ubuntu-Medium.ttf
          weight: 500
        - asset: fonts/Ubuntu/Ubuntu-Bold.ttf
          weight: 700

flutter_native_splash:
  ios: true
  android: true
  android_12:
    color: '#000000'
    image: 'assets/splash.png'
  color: '#000000'
  image: 'assets/splash.png'